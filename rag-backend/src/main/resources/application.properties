spring.application.name=rag-backend
server.port=${PORT:8081}

# Read secrets from rag-backend/.env (KEY=VALUE, not committed). Copy .env.example to .env first.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL + pgvector (Docker container from docker-compose.yml, port 5433)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/thairag}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rag_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Flyway creates the tables; Hibernate only checks that entities match them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Python model service (rag-model-service)
app.model-service.base-url=${MODEL_SERVICE_URL:http://127.0.0.1:8001}
app.model-service.api-key=${MODEL_SERVICE_API_KEY:}
app.model-service.timeout-seconds=${MODEL_SERVICE_TIMEOUT_SECONDS:300}
# Chunks sent to /embed per request (model service accepts up to 64)
app.embed.batch-size=32

# Frontend origins allowed to call /api/** (comma separated)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3001}

# LLM (Typhoon, OpenAI-compatible). Put TYPHOON_API_KEY in rag-backend/.env
spring.ai.openai.api-key=${TYPHOON_API_KEY:not-set}
spring.ai.openai.base-url=${LLM_BASE_URL:https://api.opentyphoon.ai/v1}
spring.ai.openai.chat.model=${LLM_MODEL:typhoon-v2.5-30b-a3b-instruct}
spring.ai.openai.chat.temperature=0.1
spring.ai.openai.timeout=60s
spring.ai.openai.max-retries=1
spring.ai.retry.max-attempts=2
# We only use chat; embeddings come from the Python model service
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# RAG answer settings (override in .env for experiments, then restart):
# how many chunks to send to the LLM, the minimum similarity to count as relevant,
# and how chunks are written in the prompt (plain | tagged)
app.chat.top-k=${CHAT_TOP_K:5}
app.chat.min-score=${CHAT_MIN_SCORE:0.35}
app.chat.source-format=${CHAT_SOURCE_FORMAT:tagged}
# Check each cited sentence against the chunk text and fix wrong or missing citations
app.chat.verify-citations=${CHAT_VERIFY_CITATIONS:true}
# System prompt version (v2 | v3 | v4) see PromptBuilder; eval labels results with it
app.chat.prompt-version=${CHAT_PROMPT_VERSION:v4}

# Upload limits
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
server.tomcat.max-swallow-size=40MB
