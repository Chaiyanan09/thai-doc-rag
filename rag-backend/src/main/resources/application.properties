spring.application.name=rag-backend
server.port=${PORT:8081}

# Read secrets from rag-backend/.env.example (KEY=VALUE, not committed). Copy .env.example.example to .env.example first.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL + pgvector (Docker container from docker-compose.yml, port 5433)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/thairag}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rag_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Flyway creates the tables; Hibernate only checks that entities match them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Python model service (rag-model-service)
app.model-service.base-url=${MODEL_SERVICE_URL:http://127.0.0.1:8001}
app.model-service.api-key=${MODEL_SERVICE_API_KEY:}
app.model-service.timeout-seconds=${MODEL_SERVICE_TIMEOUT_SECONDS:300}
# Chunks sent to /embed per request (model service accepts up to 64)
app.embed.batch-size=32

# Frontend origins allowed to call /api/** (comma separated)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3001}

# Upload limits
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
server.tomcat.max-swallow-size=40MB
